apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data
spec:
  type: NodePort
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      nodePort: 30379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7
          ports:
            - name: valkey
              containerPort: 6379
          args: ["--appendonly", "yes"]
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: valkey-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual
        resources:
          requests:
            storage: 5Gi