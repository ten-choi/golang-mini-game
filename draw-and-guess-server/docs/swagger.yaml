basePath: /app
definitions:
  models.ApiResult:
    properties:
      message:
        type: string
      result: {}
      status:
        type: boolean
    type: object
  models.GameRoom:
    properties:
      created_at:
        type: string
      current_word:
        type: string
      drawer_user:
        description: 방장 (그림 그리는 사람)
        type: string
      game_status:
        description: waiting, playing, finished
        type: string
      id:
        type: string
      is_active:
        type: boolean
      max_rounds:
        description: 최대 라운드 (3)
        type: integer
      players:
        description: 참가자 목록
        items:
          $ref: '#/definitions/models.Player'
        type: array
      round_number:
        description: 현재 라운드 (1-3)
        type: integer
      time_left:
        description: 남은 시간 (초)
        type: integer
      updated_at:
        type: string
      used_words:
        description: 사용된 단어들
        items:
          type: string
        type: array
      uuid:
        type: string
      winning_score:
        description: 우승 점수 (3)
        type: integer
    type: object
  models.Player:
    properties:
      attempts:
        description: 이번 라운드 제출 횟수
        type: integer
      score:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for Draw and Guess multiplayer game
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Draw and Guess Game API
  version: "1.0"
paths:
  /game/room:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Create a new game room with the specified drawer
      parameters:
      - description: Username of the room creator
        in: formData
        name: ldap_user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  $ref: '#/definitions/models.GameRoom'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Create a new game room
      tags:
      - game-rooms
  /game/room/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a game room (host only)
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Delete game room
      tags:
      - game-rooms
    patch:
      consumes:
      - application/x-www-form-urlencoded
      description: Update game room properties or advance to the next round
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Action to perform (e.g., 'advance_round')
        in: formData
        name: action
        type: string
      - description: Number of users
        in: formData
        name: user_count
        type: integer
      - description: Room active status
        in: formData
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  $ref: '#/definitions/models.GameRoom'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Update game room
      tags:
      - game-rooms
  /game/room/{id}/answer:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Check if the submitted answer is correct
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Username
        in: formData
        name: ldap_user
        required: true
        type: string
      - description: Answer to check
        in: formData
        name: answer
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  $ref: '#/definitions/models.GameRoom'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Check answer
      tags:
      - game-rooms
  /game/room/{id}/chat:
    post:
      consumes:
      - application/json
      description: Process chat messages and check if they are correct answers
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Chat message data
        in: body
        name: message
        required: true
        schema:
          properties:
            message:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Handle chat message
      tags:
      - game-rooms
  /game/room/{id}/join:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Join an existing game room
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Username of the player joining
        in: formData
        name: ldap_user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  $ref: '#/definitions/models.GameRoom'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Join a game room
      tags:
      - game-rooms
  /game/room/{id}/leave:
    post:
      consumes:
      - application/json
      description: Remove a player from the game room
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Username of the player leaving
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  $ref: '#/definitions/models.GameRoom'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Leave game room
      tags:
      - game-rooms
  /game/room/{id}/start:
    post:
      consumes:
      - application/json
      description: Start the game in a room (host only)
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  $ref: '#/definitions/models.GameRoom'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ApiResult'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ApiResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Start a game
      tags:
      - game-rooms
  /game/rooms:
    get:
      consumes:
      - application/json
      description: Get all active game rooms or a specific room by ID
      parameters:
      - description: Room ID (UUID)
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.ApiResult'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/models.GameRoom'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ApiResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ApiResult'
      summary: Get game rooms
      tags:
      - game-rooms
schemes:
- http
- https
swagger: "2.0"
