asyncapi: 2.6.0
info:
  title: Draw and Guess Game WebSocket API
  version: 1.0.0
  description: |
    실시간 그림 맞추기 게임을 위한 WebSocket API 문서
    
    ## 연결 방법
    ```javascript
    const ws = new WebSocket('ws://localhost:8080/app/ws');
    ```
    
    ## 기본 메시지 구조
    모든 메시지는 다음 구조를 따릅니다:
    ```json
    {
      "type": "subscribe|unsubscribe|message",
      "channel": "game/room-{roomId}",
      "data": {}
    }
    ```
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  development:
    url: ws://localhost:8080/app/ws
    protocol: ws
    description: 개발 서버

channels:
  'game/room-{roomId}':
    description: 게임 방 관련 이벤트 채널 - 플레이어 입장/퇴장, 게임 상태 변경 등
    parameters:
      roomId:
        description: 게임방 고유 ID
        schema:
          type: string
    publish:
      summary: 클라이언트가 게임방에 메시지 전송
      description: 구독 요청 또는 게임 액션을 서버로 전송
      message:
        oneOf:
          - $ref: '#/components/messages/SubscribeMessage'
          - $ref: '#/components/messages/UnsubscribeMessage'
    subscribe:
      summary: 서버로부터 게임 이벤트 수신
      description: 게임 진행 중 발생하는 다양한 이벤트를 수신
      message:
        oneOf:
          - $ref: '#/components/messages/PlayerJoinedMessage'
          - $ref: '#/components/messages/PlayerLeftMessage'
          - $ref: '#/components/messages/GameStateUpdateMessage'
          - $ref: '#/components/messages/RoundStartMessage'
          - $ref: '#/components/messages/RoundEndMessage'
          - $ref: '#/components/messages/CorrectAnswerMessage'
          - $ref: '#/components/messages/GameEndMessage'

  'chat/room-{roomId}':
    description: 채팅 메시지 채널
    parameters:
      roomId:
        description: 게임방 고유 ID
        schema:
          type: string
    publish:
      summary: 채팅 메시지 전송
      description: 게임방에 채팅 메시지를 전송하거나 구독 관리
      message:
        oneOf:
          - $ref: '#/components/messages/SubscribeMessage'
          - $ref: '#/components/messages/UnsubscribeMessage'
          - $ref: '#/components/messages/ChatMessage'
    subscribe:
      summary: 채팅 메시지 수신
      description: 다른 플레이어가 보낸 채팅 메시지를 수신
      message:
        $ref: '#/components/messages/ChatMessage'

  'draw/room-{roomId}':
    description: 그림 그리기 데이터 채널
    parameters:
      roomId:
        description: 게임방 고유 ID
        schema:
          type: string
    publish:
      summary: 그림 데이터 전송
      description: 그림 그리기 액션을 서버로 전송하거나 구독 관리
      message:
        oneOf:
          - $ref: '#/components/messages/SubscribeMessage'
          - $ref: '#/components/messages/UnsubscribeMessage'
          - $ref: '#/components/messages/DrawingMessage'
    subscribe:
      summary: 그림 데이터 수신
      description: 그림 그리는 플레이어의 드로잉 데이터를 실시간으로 수신
      message:
        $ref: '#/components/messages/DrawingMessage'

components:
  messages:
    SubscribeMessage:
      name: Subscribe
      title: 채널 구독
      summary: 특정 채널을 구독하여 이벤트를 수신합니다
      contentType: application/json
      payload:
        type: object
        required:
          - type
          - channel
        properties:
          type:
            type: string
            const: subscribe
            description: 메시지 타입
          channel:
            type: string
            description: 구독할 채널
            examples:
              - game/room-abc123
              - chat/room-abc123
              - draw/room-abc123
      examples:
        - name: 게임방 구독
          summary: 게임방 채널 구독 예시
          payload:
            type: subscribe
            channel: game/room-abc123

    UnsubscribeMessage:
      name: Unsubscribe
      title: 채널 구독 해제
      summary: 구독 중인 채널의 이벤트 수신을 중단합니다
      contentType: application/json
      payload:
        type: object
        required:
          - type
          - channel
        properties:
          type:
            type: string
            const: unsubscribe
            description: 메시지 타입
          channel:
            type: string
            description: 구독 해제할 채널
            examples:
              - game/room-abc123
      examples:
        - name: 게임방 구독 해제
          summary: 게임방 채널 구독 해제 예시
          payload:
            type: unsubscribe
            channel: game/room-abc123

    ChatMessage:
      name: ChatMessage
      title: 채팅 메시지
      summary: 게임방 내 채팅 메시지
      contentType: application/json
      payload:
        type: object
        required:
          - type
          - channel
          - data
        properties:
          type:
            type: string
            const: message
            description: 메시지 타입
          channel:
            type: string
            description: 채널명
            examples:
              - chat/room-abc123
          data:
            type: object
            required:
              - room_id
              - user_id
              - username
              - message
            properties:
              room_id:
                type: string
                description: 게임방 ID
                example: abc123
              user_id:
                type: string
                description: 발신자 ID
                example: user-001
              username:
                type: string
                description: 발신자 닉네임
                example: 홍길동
              message:
                type: string
                description: 채팅 메시지 내용
                example: 안녕하세요!
      examples:
        - name: 채팅 전송
          summary: 채팅 메시지 전송 예시
          payload:
            type: message
            channel: chat/room-abc123
            data:
              room_id: abc123
              user_id: user-001
              username: 홍길동
              message: 안녕하세요!

    DrawingMessage:
      name: DrawingMessage
      title: 그림 그리기 메시지
      summary: 실시간 그림 그리기 데이터
      contentType: application/json
      payload:
        type: object
        required:
          - type
          - channel
          - data
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
            examples:
              - draw/room-abc123
          data:
            type: object
            required:
              - room_id
              - action
            properties:
              room_id:
                type: string
                example: abc123
              action:
                type: string
                enum:
                  - draw
                  - clear
                  - undo
                description: 그리기 액션
              points:
                type: array
                description: 그리기 좌표 (draw 액션일 때)
                items:
                  type: object
                  properties:
                    x:
                      type: number
                      example: 120.5
                    y:
                      type: number
                      example: 85.3
              color:
                type: string
                description: 색상 (Hex 코드)
                example: '#FF0000'
              width:
                type: integer
                description: 선 두께
                example: 5
      examples:
        - name: 그리기 액션
          summary: 그림 그리기 예시
          payload:
            type: message
            channel: draw/room-abc123
            data:
              room_id: abc123
              action: draw
              points:
                - x: 120.5
                  y: 85.3
                - x: 125.0
                  y: 90.0
              color: '#FF0000'
              width: 5

    PlayerJoinedMessage:
      name: PlayerJoined
      title: 플레이어 입장
      summary: 새로운 플레이어가 게임방에 입장했을 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
            example: game/room-abc123
          data:
            type: object
            properties:
              room_id:
                type: string
                example: abc123
              user_id:
                type: string
                example: user-003
              username:
                type: string
                example: 이영희
      examples:
        - name: 플레이어 입장 알림
          payload:
            type: message
            channel: game/room-abc123
            data:
              room_id: abc123
              user_id: user-003
              username: 이영희

    PlayerLeftMessage:
      name: PlayerLeft
      title: 플레이어 퇴장
      summary: 플레이어가 게임방에서 퇴장했을 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
          data:
            type: object
            properties:
              room_id:
                type: string
              user_id:
                type: string
              username:
                type: string
      examples:
        - name: 플레이어 퇴장 알림
          payload:
            type: message
            channel: game/room-abc123
            data:
              room_id: abc123
              user_id: user-003
              username: 이영희

    GameStateUpdateMessage:
      name: GameStateUpdate
      title: 게임 상태 업데이트
      summary: 게임 상태가 변경되었을 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
          data:
            type: object
            properties:
              room_id:
                type: string
                example: abc123
              current_round:
                type: integer
                example: 2
              drawer:
                type: string
                example: user-001
              time_left:
                type: integer
                example: 45
                description: 남은 시간 (초)
              players:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    score:
                      type: integer
                    attempts:
                      type: integer

    RoundStartMessage:
      name: RoundStart
      title: 라운드 시작
      summary: 새로운 라운드가 시작될 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
          data:
            type: object
            properties:
              room_id:
                type: string
                example: abc123
              round:
                type: integer
                example: 3
              drawer:
                type: string
                example: user-001
                description: 그림 그리는 플레이어
              topic:
                type: string
                example: 사과
                description: 주제 (그림 그리는 사람만 받음)
              topic_hint:
                type: string
                example: 과일 (2자)
              time_limit:
                type: integer
                example: 60
                description: 제한 시간 (초)

    RoundEndMessage:
      name: RoundEnd
      title: 라운드 종료
      summary: 라운드가 종료되었을 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
          data:
            type: object
            properties:
              room_id:
                type: string
                example: abc123
              round:
                type: integer
                example: 3
              topic:
                type: string
                example: 사과
                description: 정답
              winners:
                type: array
                description: 정답 맞춘 플레이어 목록
                items:
                  type: string
              scoreboard:
                type: array
                description: 현재 점수판
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    score:
                      type: integer
                    attempts:
                      type: integer

    CorrectAnswerMessage:
      name: CorrectAnswer
      title: 정답 알림
      summary: 플레이어가 정답을 맞췄을 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
          data:
            type: object
            properties:
              room_id:
                type: string
                example: abc123
              user_id:
                type: string
                example: user-002
              username:
                type: string
                example: 김철수
              answer:
                type: string
                example: 사과
              score:
                type: integer
                example: 100
                description: 획득 점수

    GameEndMessage:
      name: GameEnd
      title: 게임 종료
      summary: 게임이 종료되었을 때 발생
      contentType: application/json
      payload:
        type: object
        properties:
          type:
            type: string
            const: message
          channel:
            type: string
          data:
            type: object
            properties:
              room_id:
                type: string
                example: abc123
              winner:
                type: object
                description: 우승자
                properties:
                  username:
                    type: string
                    example: 김철수
                  score:
                    type: integer
                    example: 500
                  attempts:
                    type: integer
                    example: 3
              final_score:
                type: array
                description: 최종 점수판
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    score:
                      type: integer
                    attempts:
                      type: integer

