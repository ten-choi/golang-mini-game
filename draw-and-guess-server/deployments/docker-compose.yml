version: "3.9"

services:
  valkey:
    image: valkey/valkey:latest
    container_name: draw-guess-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes --requirepass game123
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: draw-guess-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: draw_and_guess_db
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped

volumes:
  valkey-data:
  mongo-data:
